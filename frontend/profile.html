<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem 2rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        .profile-info h1 {
            color: #333;
            margin-bottom: 0.5rem;
        }
        .profile-info p {
            color: #666;
        }
        .profile-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .detail-item {
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .detail-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .detail-value {
            color: #333;
            font-weight: 500;
        }
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Profile</div>
        <div>
            <a href="profile_settings.html" class="btn" style="margin-right: 10px;">Edit Profile</a>
            <a href="welcome.html" class="btn" style="margin-right: 10px;">Dashboard</a>
            <form action="#" method="post" id="logout-form" style="display: inline;">
                <button type="submit" class="btn">Logout</button>
            </form>
        </div>
    </nav>
    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div id="profile-picture"></div>
                <div class="profile-info">
                    <h1 id="profile-name"></h1>
                    <p id="profile-username"></p>
                </div>
            </div>
            <div class="profile-details">
                <div>Email<br><span id="profile-email"></span></div>
                <div>Phone<br><span id="profile-phone"></span></div>
                <div>Country<br><span id="profile-country"></span></div>
                <div>Member Since<br><span id="profile-member-since"></span></div>
            </div>
            <div id="profile-bio-section" style="display:none;">
                <div>Bio</div>
                <div id="profile-bio"></div>
            </div>
        </div>
    </div>
    <script>
document.addEventListener('DOMContentLoaded', function() {
  fetch('http://localhost:5001/profile', {
    credentials: 'include'
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      const user = data.user;
      document.getElementById('profile-name').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim();
      document.getElementById('profile-username').textContent = user.username ? '@' + user.username : '';
      document.getElementById('profile-email').textContent = user.email || 'Not set';
      document.getElementById('profile-phone').textContent = user.phone || 'Not set';
      document.getElementById('profile-country').textContent = user.country || 'Not set';
      if (user.created_at) {
        const date = new Date(user.created_at);
        document.getElementById('profile-member-since').textContent = date.toLocaleString('default', { month: 'long', year: 'numeric' });
      } else {
        document.getElementById('profile-member-since').textContent = 'Not set';
      }
      if (user.bio) {
        document.getElementById('profile-bio-section').style.display = '';
        document.getElementById('profile-bio').textContent = user.bio;
      }
      // Optionally handle avatar/profile picture here if you want
    }
  });
});
</script>
</body>
</html>
