<!DOCTYPE html>
<html>
<head>
    <title>Register Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 400px;
            animation: float 0.8s ease-in-out forwards;
        }
        @keyframes float {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.9);
        }
        .form-group input:focus {
            border-color: #764ba2;
            outline: none;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.2);
        }
        .requirements {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.5rem;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .msg {
            color: #ff4444;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            animation: shake 0.5s ease-in-out;
        }
        .links {
            text-align: center;
            margin-top: 1.5rem;
        }
        .links a {
            color: #764ba2;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        <form action="#" method="post" id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
                <div class="requirements">
                    Password must be at least 8 characters long and contain letters, numbers, and special characters
                </div>
            </div>
            <button type="submit" class="btn">Register</button>
            <div id="register-message" style="color: red; margin-bottom: 1em;"></div>
        </form>
        <div class="links">
            <a href="index.html">Already have an account? Sign in</a>
        </div>
    </div>
    <script>
        function validateForm() {
            const password = document.getElementById('password').value;
            const passwordPattern = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$/;
            
            if (!passwordPattern.test(password)) {
                alert('Password must be at least 8 characters and contain letters, numbers, and special characters');
                return false;
            }
            return true;
        }
    </script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
  const registerForm = document.getElementById('register-form');
  const messageDiv = document.getElementById('register-message');
  if (registerForm) {
    registerForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(registerForm);
      fetch('http://localhost:5001/register', {
        method: 'POST',
        body: formData,
        credentials: 'include'
      })
      .then(async res => {
        let data;
        try {
          data = await res.json();
        } catch (e) {
          messageDiv.textContent = 'Server error: ' + res.status;
          messageDiv.style.color = 'red';
          return;
        }
        messageDiv.textContent = data.message;
        messageDiv.style.color = data.success ? 'green' : 'red';
        if (data.success) {
          setTimeout(() => window.location.href = 'index.html', 1000);
        }
      })
      .catch(err => {
        messageDiv.textContent = 'Error: ' + err;
        messageDiv.style.color = 'red';
      });
    });
  }
});
</script>
</body>
</html>
