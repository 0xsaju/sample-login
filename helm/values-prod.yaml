replicaCount: 2  # Increase for HA

app:
  name: sample-login
  image:
    repository: 0xsaju/sample-login
    tag: ac3ee02d2ee2d8f1ac5907be92a0b7b19e5fb2db
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5000
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  uploads:
    size: 5Gi       # Increase for production
    storageClass: "local-path"  # Change to match your available storage class
  env:
    MYSQL_HOST: "sample-login-mysql.sample-login.svc.cluster.local"
    MYSQL_PORT: "3306"
    MYSQL_DATABASE: "sample_login"

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: "192.168.56.101"  # You can use your node IP instead for testing
      paths:
        - path: /
          pathType: Prefix
  tls: []  # Removed TLS for initial testing

mysql:
  image:
    repository: 0xsaju/sample-login
    tag: ac3ee02d2ee2d8f1ac5907be92a0b7b19e5fb2db
  rootPassword: "mysecretpassword"
  database: sample_login
  service:
    port: 3306
    annotations:
      service.kubernetes.io/topology-aware-hints: auto
  persistence:
    size: 1Gi
    storageClass: "local-path"
  resources:
    limits:
      cpu: 500m    # Reduced for testing
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
      #test
