replicaCount: 2 # Increase for HA
app:
  name: sample-login
  image:
    repository: 0xsaju/sample-login
    tag: f546f8916d4d14e266a85445a3f05c81e1769795
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5000
  resources:
    limits:
      cpu: 300m # Changed value to trigger sync
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  uploads:
    size: 5Gi # Increase for production
    storageClass: "local-path" # Change to match your available storage class

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: "192.168.56.101.nip.io" # You can use your node IP instead for testing
      paths:
        - path: /
          pathType: Prefix
  tls: [] # Removed TLS for initial testing
