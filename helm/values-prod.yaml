replicaCount: 2

app:
  name: sample-login
  image:
    repository: 0xsaju/sample-login
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5000
  resources:
    limits:
      cpu: "300m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: "192.168.56.101.nip.io"
      paths:
        - path: /
          pathType: Prefix
