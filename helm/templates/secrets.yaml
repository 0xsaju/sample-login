apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.name }}-mysql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  mysql-root-password: mysecretpassword  # Match with app.py default
