name: CI/CD Pipeline

on:
  push:
    branches: [ dev_ci_cd_v1 ]
  pull_request:
    branches: [ dev_ci_cd_v1 ]

env:
  DOCKER_IMAGE: 0xsaju/sample-login

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Update Helm values
        run: |
          # Fetch latest changes first
          git pull origin ${GITHUB_REF##*/} || true
          
          # Update only the app image tag, not MySQL
          yq eval ".app.image.tag = \"${{ github.sha }}\"" -i helm/values-prod.yaml
          
          # Don't update MySQL image settings
          if git diff --exit-code helm/values-prod.yaml; then
            echo "No changes to commit"
            exit 0
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add helm/values-prod.yaml
          git commit -m "chore: update app image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          # Use --force-if-includes instead of --force
          git push --force-if-includes
