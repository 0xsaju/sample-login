apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-login
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/0xsaju/sample-login.git
    targetRevision: dev_ci_cd_without_mysql
    path: helm
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: "app.image.tag"
          value: "latest"
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-login
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
